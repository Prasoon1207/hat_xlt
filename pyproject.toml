[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hat-xlt"
version = "0.1.0"
description = "Hardness Adjusted Transfer (HAT) Score: De-confounding source capability from cross-lingual transfer evaluation (EMNLP 2026)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Prasoon Bajpai", email = "prbajpai@google.com"},
    {name = "Eleftheria Briakou"},
    {name = "Colin Cherry"},
    {name = "Preethi Jyothi"},
    {name = "Vihari Piratla", email = "vpiratla@google.com"},
]
keywords = [
    "multilingual",
    "cross-lingual-transfer",
    "llm-evaluation",
    "nlp",
    "emnlp",
    "hat-score",
]
dependencies = [
    "numpy>=1.22.0,<2.1.0; python_version < '3.10'",
    "numpy>=1.24.0; python_version >= '3.10'",
    "matplotlib>=3.6.0,<3.10.0; python_version < '3.10'",
    "matplotlib>=3.7.0; python_version >= '3.10'",
]

[project.optional-dependencies]
estimators = [
    "scipy>=1.9.0,<1.14.0; python_version < '3.10'",
    "scipy>=1.10.0; python_version >= '3.10'",
    "scikit-learn>=1.1.0,<1.6.0; python_version < '3.10'",
    "scikit-learn>=1.3.0; python_version >= '3.10'",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://prasoon1207.github.io/hat_xlt"
Repository = "https://github.com/Prasoon1207/hat_xlt"
Paper = "https://arxiv.org/abs/2606.21954"

[project.scripts]
hat-eval = "hat_xlt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
